server {
    listen 80;
    listen [::]:80;
    server_name dicionariogamer.com.br www.dicionariogamer.com.br;
    location / { return 301 https://dicionariogamer.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dicionariogamer.com.br www.dicionariogamer.com.br;

    ssl_certificate /etc/letsencrypt/live/dicionariogamer.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dicionariogamer.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/dicionariogamer.access.log;
    error_log /var/log/nginx/dicionariogamer.error.log warn;
    server_tokens off;
    location / { return 301 https://dicionariogamer.com$request_uri; }
}
