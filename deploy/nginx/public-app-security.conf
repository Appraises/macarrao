# Shared hardening for public applications that do not execute PHP or CGI.
# Keep these regex locations before the application's generic location block.

location ~* ^/(?:wp-admin|wp-content|wp-includes|wp-json|wp-login(?:\.php)?|xmlrpc(?:\.php)?|phpmyadmin|adminer(?:\.php)?|vendor/phpunit|cgi-bin|boaform|actuator|server-status)(?:/|$) {
    return 404;
}

location ~* \.(?:php[0-9]?|phtml|phar|asp|aspx|jsp|cgi|pl)(?:/|$) {
    return 404;
}

# ACME challenges remain available to Certbot; every other dotfile stays hidden.
location ~ /\.(?!well-known(?:/|$)) {
    return 404;
}
