server {
    listen 80;
    listen [::]:80;
    server_name dicionariogamer.com www.dicionariogamer.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dicionariogamer-acme;
        try_files $uri =404;
    }
    location / { return 301 https://dicionariogamer.com$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.dicionariogamer.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dicionariogamer-acme;
        try_files $uri =404;
    }
    location / { return 301 https://api.dicionariogamer.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dicionariogamer.com www.dicionariogamer.com;

    ssl_certificate /etc/letsencrypt/live/dicionariogamer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dicionariogamer.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.dicionariogamer.com) {
        return 301 https://dicionariogamer.com$request_uri;
    }
    include /etc/nginx/snippets/public-app-security.conf;
    access_log /var/log/nginx/dicionariogamer.access.log;
    error_log /var/log/nginx/dicionariogamer.error.log warn;
    server_tokens off;
    root /srv/dicionario/dist;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /og/ {
        try_files $uri =404;
        expires 7d;
    }
    location ~ ^/static-loader-data(?:-manifest-[^/]+\.json|/.*\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html =404;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.dicionariogamer.com;

    ssl_certificate /etc/letsencrypt/live/dicionariogamer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dicionariogamer.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/public-app-security.conf;
    access_log /var/log/nginx/dicionariogamer-api.access.log;
    error_log /var/log/nginx/dicionariogamer-api.error.log warn;
    server_tokens off;
    client_max_body_size 10M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:3002;
    }
}
